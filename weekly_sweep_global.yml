name: RigIntel Global Weekly Email

on:
  schedule:
    - cron: '0 11 * * 3'   # Every Wednesday at 6:00 AM CDT (11:00 UTC) — day after NA sweep
  workflow_dispatch:

permissions:
  contents: write

jobs:
  send-rig-intel-global:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic sendgrid

      - name: Run RigIntel Global sweep and send email
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL_GLOBAL }}
        run: python rig_intel_emailer_global.py

      - name: Commit updated global dashboard data
        run: |
          git config user.name "RigIntel Global Bot"
          git config user.email "rigintel-global@users.noreply.github.com"
          git add public/data/rigs.json
          git status
          git diff --staged --quiet || git commit -m "Weekly global rig data update - $(date +'%Y-%m-%d')"
          git push
